<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Intelligence</title>
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Background Layer -->
    <div class="background-layer">
        <div class="overlay-gradient"></div>
    </div>

    <!-- Main Application Container -->
    <div class="app-container">

        <!-- Navbar -->
        <nav class="navbar">
            <div class="logo">
                <i class="fa-solid fa-satellite-dish"></i> Disaster Intelligence
            </div>
        </nav>

        <!-- Hero Content -->
        <main class="hero-section">
            <div class="content-wrapper">
                
                <!-- Left Column (Text & Input) -->
                <div class="left-panel">
                    <!-- <h1 class="hero-title">Any disaster?<br>We are here to help!</h1> -->
                    <p class="hero-subtitle">Upload a photo or capture live footage to analyze disaster events</p>

                    <!-- Input Section Card (Glassmorphism) -->
                    <div class="glass-card input-card">
                        
                        <!-- Tabs -->
                        <div class="tabs">
                            <button class="tab-btn active" data-tab="upload-tab">
                                <i class="fa-solid fa-cloud-arrow-up"></i> Upload Image
                            </button>
                            <button class="tab-btn" data-tab="webcam-tab">
                                <i class="fa-solid fa-camera"></i> Use Webcam
                            </button>
                        </div>

                        <!-- Tab Contents -->
                        <div class="tab-content active" id="upload-tab">
                            <div class="drop-zone" id="drop-zone">
                                <i class="fa-regular fa-image"></i>
                                <span class="drop-text">Drag and drop an image here<br>or <span class="highlight">browse files</span></span>
                                <input type="file" id="file-input" accept="image/png, image/jpeg, image/jpg" hidden>
                            </div>
                            <div class="preview-container hidden" id="upload-preview-container">
                                <img id="upload-preview-img" alt="Upload Preview">
                                <button class="icon-btn clear-btn" id="clear-upload"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        </div>

                        <div class="tab-content" id="webcam-tab">
                            <div class="webcam-container">
                                <video id="webcam-video" autoplay playsinline></video>
                                <canvas id="webcam-canvas" hidden></canvas>
                                <img id="webcam-preview-img" class="hidden" alt="Webcam Capture">
                            </div>
                            <div class="webcam-controls">
                                <button class="action-btn sm-btn" id="start-webcam">Start Camera</button>
                                <button class="action-btn sm-btn hidden" id="capture-btn"><i class="fa-solid fa-camera"></i> Capture</button>
                                <button class="action-btn sm-btn hidden" id="retake-btn"><i class="fa-solid fa-rotate-left"></i> Retake</button>
                            </div>
                        </div>

                        <!-- Main Action Button -->
                        <button class="action-btn primary-btn" id="analyze-btn" disabled>
                            <span>Analyze Disaster</span>
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                        </button>
                    </div>
                </div>

                <!-- Right Column (Output) -->
                <div class="right-panel">
                    <!-- Results Glass Card -->
                    <div class="glass-card result-card hidden" id="result-card">
                        
                        <div class="loading-state hidden" id="loading-spinner">
                            <div class="spinner"></div>
                            <p>Analyzing intelligent data...</p>
                        </div>

                        <div class="result-state" id="result-content">
                            <div class="result-header">
                                <h3>Predicted Event</h3>
                                <div class="icon-badge pulse" id="result-icon-badge">
                                    <i class="fa-solid fa-triangle-exclamation" id="result-icon"></i>
                                </div>
                            </div>
                            
                            <h2 class="prediction-text" id="prediction-text">--</h2>
                            
                            <div class="confidence-meter">
                                <div class="meter-header">
                                    <span>AI Confidence</span>
                                    <span class="confidence-value" id="confidence-value">--%</span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                                </div>
                            </div>

                            <p class="safety-tip" id="dynamic-tip">Awaiting data...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
